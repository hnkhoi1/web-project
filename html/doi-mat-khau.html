<body data-page="profile">
<div id="app-header"></div>
<main id="main" tabindex="-1">
<section class="section"><div class="wrap narrow"><h1>Đổi mật khẩu</h1><nav class="tabs" aria-label="Tài khoản"><a href="ho-so.html">Hồ sơ</a><a href="doi-mat-khau.html" aria-current="page">Mật khẩu</a><a href="tuy-chinh.html">Tùy chỉnh</a></nav><div id="demo-lock" class="alert alert-info" role="status" hidden><span><strong>Tài khoản demo là tài khoản cố định trong mã nguồn</strong> nên không thể chỉnh sửa hay xóa. Hãy <a href="register.html">đăng ký một tài khoản mới</a> (đăng xuất trước) để thử đầy đủ chức năng này.</span></div>
  <form id="pw-form" novalidate data-match="password,password2"><div class="field"><label for="current">Mật khẩu hiện tại</label><div class="pw-wrap"><input id="current" type="password" name="current" autocomplete="current-password" required><button type="button" class="pw-toggle" aria-pressed="false" aria-label="Hiện mật khẩu">Hiện</button></div></div><div class="field"><label for="password">Mật khẩu mới</label><div class="pw-wrap"><input id="password" type="password" name="password" autocomplete="new-password" required minlength="8" maxlength="72" data-strength><button type="button" class="pw-toggle" aria-pressed="false" aria-label="Hiện mật khẩu">Hiện</button></div></div>
    <div class="meter" data-for="password" aria-hidden="true"><span></span></div><p class="field-hint meter-label" data-for="password" aria-live="polite"></p><div class="field"><label for="password2">Nhập lại mật khẩu mới</label><div class="pw-wrap"><input id="password2" type="password" name="password2" autocomplete="new-password" required><button type="button" class="pw-toggle" aria-pressed="false" aria-label="Hiện mật khẩu">Hiện</button></div></div>
    <button class="btn btn-primary" type="submit">Đổi mật khẩu</button></form></div></section>
</main>
