<!doctype html>
<html lang="vi" data-theme="system" data-font="md" data-note-color="yellow">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Liên hệ — Hình Sự Tra Cứu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&amp;display=swap">
<!-- Thêm ../ trước các tài nguyên css và js -->
<link rel="stylesheet" href="../css/app.css">
<script src="../js/db.js"></script>
<script src="../js/app.js"></script>
</head>
<body data-page="contact">
<div id="app-header"></div>
<main id="main" tabindex="-1">
<section class="section"><div class="wrap narrow"><h1>Liên hệ / Gửi câu hỏi</h1>
  <p class="muted">Nếu chatbot chưa trả lời thỏa đáng, hãy để lại câu hỏi để chuyên viên xem lại.</p>
  <form id="contact-form" class="form-grid" novalidate>
    <div class="field"><label for="ho_ten">Họ tên</label><input id="ho_ten" name="ho_ten" autocomplete="name" required></div>
    <div class="field"><label for="sdt">Số điện thoại (không bắt buộc)</label><input id="sdt" name="sdt" type="tel" autocomplete="tel"></div>
    <div class="field full"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
    <div class="field full"><label for="noi_dung">Nội dung câu hỏi</label><textarea id="noi_dung" name="noi_dung" rows="6" maxlength="2000" required></textarea></div>
    <div class="full"><button class="btn btn-primary" type="submit">Gửi câu hỏi</button></div></form>
</div></section>
</main>
<div id="app-footer"></div>
<!-- Thêm ../ trước script js/contact.js -->
<script src="../js/contact.js"></script>
</body>
</html>
