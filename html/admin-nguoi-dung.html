<!doctype html>
<html lang="vi" data-theme="system" data-font="md" data-note-color="yellow">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Quản trị: Người dùng — Hình Sự Tra Cứu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&amp;display=swap">
<link rel="stylesheet" href="../css/app.css">
<script src="../js/db.js"></script>
<script src="../js/app.js"></script>
</head>
<body data-page="" data-admin="users">
<div id="app-header"></div>
<main id="main" tabindex="-1">
<section class="section"><div class="wrap admin-shell">
  <nav id="admin-nav" class="admin-nav" aria-label="Menu quản trị"></nav>
  <div id="admin-main" class="admin-main">
    <div class="admin-head"><h1>Người dùng</h1>
      <div class="admin-tools"><label class="sr-only" for="user-q">Tìm người dùng</label><input id="user-q" type="search" placeholder="Tìm theo email, tên..." autocomplete="off"></div></div>
    <p id="user-count" class="muted"></p>
    <div class="table-wrap"><table class="data-table"><thead><tr><th>ID</th><th>Tên đăng nhập / email</th><th>Tên hiển thị</th><th>Vai trò</th><th>Trạng thái</th><th>Ngày tạo</th><th><span class="sr-only">Thao tác</span></th></tr></thead>
      <tbody id="users-body"></tbody></table></div>
  </div>
</div></section>
<dialog id="user-delete-dialog" class="dialog dialog-sm" aria-labelledby="user-delete-t"><div class="dialog-in"><h3 id="user-delete-t">Xóa tài khoản?</h3>
  <p class="muted">Tài khoản <strong id="user-delete-name"></strong> cùng toàn bộ ghi chú sẽ bị xóa vĩnh viễn.</p>
  <div class="dialog-actions"><button type="button" class="btn btn-ghost" id="user-delete-no">Giữ lại</button><button type="button" class="btn btn-danger" id="user-delete-yes">Xóa</button></div></div></dialog>
</main>
<div id="app-footer"></div>
<script src="../js/admin.js"></script>
</body>
</html>
