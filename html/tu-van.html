<!doctype html>
<html lang="vi" data-theme="system" data-font="md" data-note-color="yellow">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Tư vấn — Hình Sự Tra Cứu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&amp;display=swap">
<!-- Thêm ../ trước các tài nguyên css và js -->
<link rel="stylesheet" href="../css/app.css">
<script src="../js/db.js"></script>
<script src="../js/app.js"></script>
</head>
<body data-page="chat">
<div id="app-header"></div>
<main id="main" tabindex="-1">
<section class="section chat-section"><div class="wrap">
  <h1>Tư vấn qua chatbot</h1><p class="muted">Mô tả tình huống bằng ngôn ngữ tự nhiên, càng chi tiết (số tiền, tỉ lệ thương tích...) càng chính xác.</p>
  <div class="chat-shell"><div class="chat-side"><h2 class="side-title">Câu hỏi gợi ý</h2><div class="chips" id="chips"></div></div>
    <div class="chat-main"><div class="chat-log" id="chat-log" role="log" aria-live="polite"></div>
      <p class="disclaimer">Câu trả lời mang tính tham khảo, dựa trên dữ liệu demo rút gọn — không phải ý kiến pháp lý chính thức.</p>
      <form id="chat-form" class="chat-input"><label class="sr-only" for="chat-input">Câu hỏi của bạn</label>
        <input id="chat-input" type="text" maxlength="500" autocomplete="off" placeholder="Nhập câu hỏi hoặc mô tả tình huống..."><button class="btn btn-primary" type="submit">Gửi</button></form></div></div>
</div></section>
</main>
<div id="app-footer"></div>
<!-- Thêm ../ trước các script js bên dưới -->
<script src="../js/data.js"></script>
<script src="../js/nlu.js"></script>
<script src="../js/scorer.js"></script>
<script src="../js/law.js"></script>
<script src="../js/chatbot.js"></script>
</body>
</html>
