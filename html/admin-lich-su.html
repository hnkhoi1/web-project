<!doctype html>
<html lang="vi" data-theme="system" data-font="md" data-note-color="yellow">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Quản trị: Lịch sử hỏi đáp — Hình Sự Tra Cứu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&amp;display=swap">
<link rel="stylesheet" href="../css/app.css">
<script src="../js/db.js"></script>
<script src="../js/app.js"></script>
</head>
<body data-page="" data-admin="history">
<div id="app-header"></div>
<main id="main" tabindex="-1">
<section class="section"><div class="wrap admin-shell">
  <nav id="admin-nav" class="admin-nav" aria-label="Menu quản trị"></nav>
  <div id="admin-main" class="admin-main">
    <div class="admin-head"><h1>Lịch sử hỏi đáp</h1>
      <div class="admin-tools"><label class="sr-only" for="history-q">Tìm câu hỏi</label><input id="history-q" type="search" placeholder="Tìm câu hỏi hoặc số điều..." autocomplete="off"></div></div>
    <p id="history-count" class="muted"></p>
    <div class="table-wrap"><table class="data-table"><thead><tr><th>Thời gian</th><th>Người hỏi</th><th>Câu hỏi</th><th>Điều luật khớp</th><th class="cell-num">Điểm</th></tr></thead>
      <tbody id="history-body"></tbody></table></div>
  </div>
</div></section>
</main>
<div id="app-footer"></div>
<script src="../js/admin.js"></script>
</body>
</html>
