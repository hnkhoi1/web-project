services:
  web:
    build:
      context: ./app/api
      target: web
      args:
        VITE_APP_NAME: ${APP_NAME:-Tra cứu Luật Hình sự}
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    # Goes through nginx, PHP and Laravel, so it fails if any of them is down.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/up"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  app:
    build:
      context: ./app/api
      target: prod
      args:
        VITE_APP_NAME: ${APP_NAME:-Tra cứu Luật Hình sự}
    env_file: .env
    environment:
      # Production migrates on start and seeds an empty database. Dev overrides this to "false".
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      AUTO_SEED: ${AUTO_SEED:-true}
    volumes:
      - app_key:/run/app-key
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy

  # Optional, for SEARCH_BLEND_ENABLED=true: docker compose --profile semantic up -d
  embedder:
    profiles: ["semantic"]
    build:
      context: ./app/embedder
      target: runtime
    mem_limit: 1500m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  # Runs the embedder's pytest suite: docker compose run --rm --build embedder-test
  embedder-test:
    profiles: ["test"]
    build:
      context: ./app/embedder
      target: test
    mem_limit: 1500m

  db:
    image: mysql:8.4
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-hinh_su}
      MYSQL_USER: ${DB_USERNAME:-hinh_su}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD must be set in .env}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  db_data:
  app_key:
