services:
  web:
    build:
      context: .
      target: web
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - app

  app:
    build:
      context: .
      target: prod
    env_file: .env
    volumes:
      - app_key:/run/app-key
    depends_on:
      db:
        condition: service_healthy

  embedder:
    build:
      context: ./docker/embedder
      target: runtime
    mem_limit: 1500m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  # Runs the embedder's pytest suite: docker compose run --rm --build embedder-test
  embedder-test:
    profiles: ["test"]
    build:
      context: ./docker/embedder
      target: test
    mem_limit: 1500m

  db:
    image: mysql:8.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-hinh_su}
      MYSQL_USER: ${DB_USERNAME:-hinh_su}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD must be set in .env}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  db_data:
  app_key:
